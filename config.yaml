##CONFIG
update-url: https://raw.githubusercontent.com/kirillpes/rocket-config/main/config.yaml

port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
ipv6: false

dns:
  enable: true
  listen: 0.0.0.0:53
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
  nameserver:
    - system

rule-providers:
  discord-domains:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/misha-tgshv/shadowrocket-configuration-file/refs/heads/release/rules/domains_discord.list
    interval: 86400
  discord-ports:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/helmiau/clashrules/refs/heads/main/shadowrocket/Game_Discord_Ports.list
    interval: 86400

rules:
